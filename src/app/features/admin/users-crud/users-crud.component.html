<div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
  <div class="btn-group" role="group" aria-label="User scope">
    <button
      type="button"
      class="btn"
      [class.btn-primary]="selectedScope === 'SUPPLIER'"
      [class.btn-outline-primary]="selectedScope !== 'SUPPLIER'"
      (click)="onScopeChange('SUPPLIER')"
    >
      Suppliers
    </button>
    <button
      type="button"
      class="btn"
      [class.btn-primary]="selectedScope === 'CONSUMER'"
      [class.btn-outline-primary]="selectedScope !== 'CONSUMER'"
      (click)="onScopeChange('CONSUMER')"
    >
      Consumers
    </button>
  </div>

  <input type="text" class="form-control w-auto" [(ngModel)]="filter" placeholder="Filter users..." />
</div>

<div class="card mb-3">
  <div class="card-header"><h6 class="mb-0">Quick status actions</h6></div>
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-sm table-striped mb-0">
        <thead>
        <tr>
          <th>Username</th>
          <th>Type</th>
          <th>Status</th>
          <th class="text-end">Action</th>
        </tr>
        </thead>
        <tbody>
        @for (user of users; track user.id) {
        <tr>
          <td>{{ user.username }}</td>
              <td>{{ user.accountType }}</td>
              <td>{{ user.enabled ? 'Enabled' : 'Disabled' }}</td>
              <td class="text-end">
                <button type="button" class="btn btn-sm btn-outline-secondary" (click)="toggleActivation(user)">
        {{ user.enabled ? 'Disable' : 'Enable' }}
        </button>
      </td>
    </tr>
        }
        </tbody>
      </table>
    </div>
  </div>
</div>

<app-crud-table
  title="User management"
  [columns]="columns"
  [rows]="filteredRows"
  [isLoading]="isLoading"
  [errorMessage]="errorMessage"
  [currentPage]="page"
  [pageSize]="size"
  [totalItems]="totalItems"
  (pageChange)="onPageChange($event)"
></app-crud-table>
