<div class="account-content">
  <div class="login-wrapper login-new">
    <div class="row w-100">
      <div class="col-lg-5 mx-auto">
        <div class="login-content user-login">

          <!-- LOGO -->
          <div class="login-logo">
            <img src="assets/img/logo.png" alt="Logo">
            <a routerLink="/" class="login-logo logo-white">
              <img src="assets/img/logo-white.svg" alt="Logo">
            </a>
          </div>

          <!-- FORM -->
          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="card">
              <div class="card-body p-5">

                <!-- HEADER -->
                <div class="login-userheading">
                  <h3>Mot de passe oublié ?</h3>
                  <h4>
                    Entrez votre email, téléphone ou nom d’utilisateur.
                    Nous vous enverrons les instructions de réinitialisation.
                  </h4>
                </div>

                <!-- IDENTIFIER -->
                <div class="mb-3">
                  <label class="form-label">
                    Identifiant <span class="text-danger">*</span>
                  </label>
                  <div class="input-group">
                    <input
                      type="text"
                      class="form-control border-end-0"
                      formControlName="identifier"
                      placeholder="Email, téléphone ou username"
                    />
                    <span class="input-group-text border-start-0">
                      <i class="ti ti-mail"></i>
                    </span>
                  </div>
                </div>

                <!-- SUCCESS -->
                <div *ngIf="message()" class="alert alert-success py-2">
                  {{ message() }}
                </div>

                <!-- ERROR -->
                <div *ngIf="error()" class="alert alert-danger py-2">
                  {{ error() }}
                </div>

                <!-- SUBMIT -->
                <div class="form-login">
                  <button
                    type="submit"
                    class="btn btn-login w-100"
                    [disabled]="isLoading()"
                  >
                    <span *ngIf="!isLoading()">Envoyer</span>
                    <span
                      *ngIf="isLoading()"
                      class="spinner-border spinner-border-sm"
                    ></span>
                  </button>
                </div>

                <!-- BACK TO LOGIN -->
                <div class="signinform text-center">
                  <h4>
                    Retour à
                    <a routerLink="/login" class="hover-a">
                      la connexion
                    </a>
                  </h4>
                </div>

                <div class="form-setlogin or-text">
                  <h4>OU</h4>
                </div>

              </div>
            </div>
          </form>
        </div>

        <!-- FOOTER -->
        <div
          class="my-4 d-flex justify-content-center align-items-center copyright-text"
        >
          <p>Copyright &copy; 2026 Agrisol GROUP</p>
        </div>
      </div>
    </div>
  </div>
</div>
