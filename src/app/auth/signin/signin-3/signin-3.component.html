<div class="account-content">
  <div class="login-wrapper login-new">
    <div class="row w-100">
      <div class="col-lg-5 mx-auto">
        <div class="login-content user-login">

          <!-- LOGO -->
          <div class="login-logo text-center mb-4">
            <img src="assets/img/logo.png" alt="Logo">
          </div>

          <!-- FORM -->
          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="card">
              <div class="card-body p-5">

                <!-- HEADING -->
                <div class="login-userheading mb-4">
                  <h3>Se connecter</h3>
                  <h4>
                    Accédez au panneau Agrisol avec votre email,
                    numéro de téléphone ou nom d’utilisateur.
                  </h4>
                </div>

                <!-- IDENTIFIER -->
                <div class="mb-3">
                  <label class="form-label">
                    Tél / Utilisateur / Email <span class="text-danger">*</span>
                  </label>
                  <div class="input-group">
                    <input
                      type="text"
                      class="form-control border-end-0"
                      formControlName="identifier"
                      placeholder="email, téléphone ou username"
                    />
                    <span class="input-group-text border-start-0">
                      <i class="ti ti-user"></i>
                    </span>
                  </div>
                </div>

                <!-- PASSWORD -->
                <div class="mb-3">
                  <label class="form-label">
                    Mot de passe <span class="text-danger">*</span>
                  </label>
                  <div class="pass-group">
                    <input
                      [type]="passwordVisible ? 'text' : 'password'"
                      class="pass-input form-control"
                      formControlName="password"
                      placeholder="••••••••"
                    />
                    <span
                      class="ti toggle-password text-gray-9"
                      [ngClass]="passwordVisible ? 'ti-eye' : 'ti-eye-off'"
                      (click)="passwordVisible = !passwordVisible">
                    </span>
                  </div>
                </div>

                <!-- MFA -->
                <div class="mb-3" *ngIf="requiresMfa()">
                  <label class="form-label">
                    Code MFA <span class="text-danger">*</span>
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="code"
                    maxlength="6"
                    placeholder="123456"
                  />
                  <div class="form-text">
                    Entrez le code de votre application d’authentification.
                  </div>
                </div>

                <!-- REMEMBER + FORGOT -->
                <div class="form-login authentication-check mb-3">
                  <div class="row">
                    <div class="col-12 d-flex align-items-center justify-content-between">
                      <div class="custom-control custom-checkbox">
                        <label class="checkboxs ps-4 mb-0 fs-16 text-gray-6">
                          <input type="checkbox" formControlName="rememberMe">
                          <span class="checkmarks"></span>
                          Se souvenir de moi
                        </label>
                      </div>
                      <div class="text-end">
                        <a
                          routerLink="/forgot-password"
                          class="fs-16 fw-medium"
                          style="color:#068c21">
                          Mot de passe oublié ?
                        </a>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- SERVER ERROR -->
                <div *ngIf="serverError()" class="alert alert-danger py-2 text-center">
                  {{ serverError() }}
                </div>

                <!-- SUBMIT -->
                <div class="form-login">
                  <button
                    type="submit"
                    class="btn btn-primary w-100"
                    [disabled]="isLoading()">
                    <span *ngIf="!isLoading()">
                      {{ requiresMfa() ? 'Valider MFA' : 'Se connecter' }}
                    </span>
                    <span *ngIf="isLoading()" class="spinner-border spinner-border-sm"></span>
                  </button>
                </div>

                <!-- REGISTER -->
                <div class="signinform text-center mt-3">
                  <h4>
                    Nouveau sur notre plateforme ?
                    <a routerLink="/register" class="hover-a">
                      Créer un compte
                    </a>
                  </h4>
                </div>

              </div>
            </div>
          </form>

        </div>

        <!-- FOOTER -->
        <div class="my-4 d-flex justify-content-center align-items-center copyright-text">
          <p>Copyright © 2026 Agrisol GROUP</p>
        </div>

      </div>
    </div>
  </div>
</div>
