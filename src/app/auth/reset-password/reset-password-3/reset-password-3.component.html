<div class="account-content">
  <div class="login-wrapper login-new">
    <div class="row w-100">
      <div class="col-lg-5 mx-auto">
        <div class="login-content user-login">

          <!-- LOGO -->
          <div class="login-logo text-center mb-4">
            <img src="assets/img/logo.png" alt="Logo">
          </div>

          <!-- FORM -->
          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="card">
              <div class="card-body p-5">

                <div class="login-userheading text-center mb-4">
                  <h3>Réinitialiser le mot de passe</h3>
                  <h4>Entrez le token et votre nouveau mot de passe</h4>
                </div>

                <!-- TOKEN -->
                <div class="mb-3">
                  <label class="form-label">Token <span class="text-danger">*</span></label>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="token"
                    placeholder="Token reçu par email"
                  />
                </div>

                <!-- NEW PASSWORD -->
                <div class="mb-3">
                  <label class="form-label">Nouveau mot de passe <span class="text-danger">*</span></label>
                  <div class="pass-group">
                    <input
                      [type]="password[1] ? 'text' : 'password'"
                      class="pass-input form-control"
                      formControlName="newPassword"
                      placeholder="Nouveau mot de passe"
                    />
                    <span
                      class="ti toggle-password text-gray-9"
                      [ngClass]="password[1] ? 'ti-eye' : 'ti-eye-off'"
                      (click)="togglePassword(1)">
                    </span>
                  </div>
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="mb-3">
                  <label class="form-label">Confirmer le mot de passe <span class="text-danger">*</span></label>
                  <div class="pass-group">
                    <input
                      [type]="password[2] ? 'text' : 'password'"
                      class="pass-input form-control"
                      formControlName="confirmPassword"
                      placeholder="Confirmer le mot de passe"
                    />
                    <span
                      class="ti toggle-password text-gray-9"
                      [ngClass]="password[2] ? 'ti-eye' : 'ti-eye-off'"
                      (click)="togglePassword(2)">
                    </span>
                  </div>
                </div>

                <!-- SUCCESS -->
                <div *ngIf="success()" class="alert alert-success py-2 text-center">
                  {{ success() }}
                </div>

                <!-- ERROR -->
                <div *ngIf="error()" class="alert alert-danger py-2 text-center">
                  {{ error() }}
                </div>

                <!-- SUBMIT -->
                <div class="form-login mt-4">
                  <button
                    type="submit"
                    class="btn btn-login w-100"
                    [disabled]="isLoading()">
                    Réinitialiser le mot de passe
                  </button>
                </div>

                <!-- BACK TO LOGIN -->
                <div class="signinform text-center mt-3 mb-0">
                  <h4>
                    Retour à
                    <a routerLink="/auth/login" class="hover-a">la connexion</a>
                  </h4>
                </div>

              </div>
            </div>
          </form>

        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="my-4 d-flex justify-content-center align-items-center copyright-text">
      <p>Copyright © 2025 AGRISOL</p>
    </div>
  </div>
</div>
